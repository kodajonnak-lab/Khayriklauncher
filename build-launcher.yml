name: Build KhayrikLauncher (Minecraft Java)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KhayrikLauncher build settings
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download official Amethyst source and submodules
        run: |
          git clone --recursive --depth 1 --branch v3_openjdk https://github.com/AngelAuraMC/Amethyst-Android.git upstream

      - name: Apply KhayrikLauncher display name
        run: python3 scripts/brand_upstream.py upstream

      - name: Build real Minecraft Java launcher APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app_pojavlauncher:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhayrikLauncher-APK
          path: upstream/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
